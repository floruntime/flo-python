kind: Workflow
name: order-processing
version: "1.4.0"

search_attributes:
  - name: customer_id
    type: string
    from: "$.input.customerId"
  - name: order_amount
    type: number
    from: "$.input.amount"
  - name: order_id
    type: string
    from: "$.input.orderId"

plans:
  payment:
    selection: health-weighted
    executors:
      - name: stripe
        run: "@actions/process-payment"
        priority: 1
        retry:
          max_attempts: 3
          initial_delay_ms: 100
        breaker:
          failure_threshold: 5
          cooldown_ms: 30000
      - name: paypal
        run: "@actions/process-payment-fallback"
        priority: 2
        retry:
          max_attempts: 2
          initial_delay_ms: 200

start:
  run: "@actions/validate-payment"
  transitions:
    success: charge
    failure: rejected

steps:
  charge:
    run: "@plan/payment"
    transitions:
      success: fulfill
      failure: rejected

  fulfill:
    run: "@actions/fulfill-order"
    transitions:
      success: notify
      failure: manual_review

  notify:
    run: "@actions/send-confirmation"
    transitions:
      success: flo.Completed
      failure: flo.Failed

  rejected:
    run: "@actions/send-rejection"
    transitions:
      success: flo.Completed
      failure: flo.Failed

  manual_review:
    wait_for_signal:
      type: "review_decision"
      timeout_ms: 86400000
      on_timeout: flo.Failed
    transitions:
      success: fulfill
      failure: rejected
