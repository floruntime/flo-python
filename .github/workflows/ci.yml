name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: Type check
        run: |
          pip install -e .
          mypy src/flo/

  # The flo the live tests run against: the commit pinned in
  # .github/flo-ref.env, built once and handed to every test job.
  flo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned flo commit
        run: |
          . ./.github/flo-ref.env
          # A branch or tag would be checked out as readily, and move.
          [[ $FLO_REF =~ ^[0-9a-f]{40}$ ]] || { echo "FLO_REF must be a full commit SHA"; exit 1; }
          echo "FLO_REF=$FLO_REF" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: floruntime/flo
          ref: ${{ env.FLO_REF }}
          path: flo-src
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # For x86-64-v2, not this runner's CPU: the test jobs run on other
      # machines, where a native build can die on an illegal instruction.
      - name: Build flo
        working-directory: flo-src
        run: zig build --release=safe -Dcpu=x86_64_v2
      - uses: actions/upload-artifact@v4
        with:
          name: flo
          path: flo-src/zig-out/bin/flo
          retention-days: 1

  test:
    needs: flo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: flo
          path: ${{ runner.temp }}/flo-bin
      - name: Start the pinned flo
        run: |
          cd "$RUNNER_TEMP"
          chmod +x flo-bin/flo
          echo "FLO_BINARY=$RUNNER_TEMP/flo-bin/flo" >> "$GITHUB_ENV"
          mkdir -p flo-data
          ./flo-bin/flo server start --port 4453 --data-dir "$RUNNER_TEMP/flo-data" > flo-server.log 2>&1 &
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/4453) 2>/dev/null; then exit 0; fi
            sleep 0.2
          done
          echo "flo server did not start"; cat flo-server.log; exit 1
      - name: Run tests
        # CI=1 turns a missing server into a failure, not a skip; FLO_BINARY
        # runs the version test against the pinned flo.
        env:
          CI: "1"
          FLO_ENDPOINT: localhost:4453
        run: pytest -v
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/flo-server.log"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/


